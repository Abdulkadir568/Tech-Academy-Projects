<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>One Page Website</title>
</head>
<body>

    <!-- 1. Navigation with Bookmarks -->
    <nav>
        <a href="#home">Home</a> | 
        <a href="#pictures">Gallery</a> | 
        <a href="#videos">Videos</a> | 
        <a href="#contact">Contact</a>
    </nav>
    <hr>

    <!-- 2. Home Section -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is a one-page HTML website assignment.</p>
    </section>
    <hr>

    <!-- 3. Pictures Section -->
    <section id="pictures">
        <h2>Photo Gallery</h2>
        <img src="https://via.placeholder.com/200" alt="Sample 1">
        <img src="https://via.placeholder.com/200" alt="Sample 2">
    </section>
    <hr>

    <!-- 4. Video Section -->
    <section id="videos">
        <h2>Featured Video</h2>
        <iframe width="420" height="315" src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
    </section>
    <hr>

    <!-- 5. Contact Form -->
    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            
            <input type="submit" value="Submit">
        </form>
    </section>
    <hr>

    <!-- 6. Footer -->
    <footer>
        <p>&copy; 2026 Tech Academy Project. All rights reserved.</p>
    </footer>

</body>
</html>
